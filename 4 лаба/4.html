<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренды в веб-дизайне</title>
    <link rel="stylesheet" href="4.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="animated-background"></div>
    <h2 style="text-align: center;">Тренды в веб-дизайне</h2>
    <div id="infographic">
        <svg width="800" height="600">
            <!-- Графические элементы SVG -->
            <rect x="70" y="82" width="200" height="200" fill="#007bff" rx="10" id="color1" />
            <text x="70" y="67" font-size="18" fill="#000" id="typography1">Корпоративный стиль</text>
            <rect x="300" y="82" width="200" height="200" fill="#ff69b4" rx="10" id="color2" />
            <text x="318" y="67" font-size="18" fill="#000" id="typography1">Креативный стиль</text>
            <rect x="530" y="82" width="200" height="200" fill="#33cc33" rx="10" id="color3" />
            <text x="535" y="67" font-size="18" fill="#000" id="typography1">Экологический стиль</text>
            <rect x="70" y="342" width="200" height="200" fill="#ff9900" rx="10" id="color4" />
            <text x="105" y="327" font-size="18" fill="#000" id="typography1">Веселый стиль</text>
            <rect x="300" y="342" width="200" height="200" fill="#6666cc" rx="10" id="color5" />
            <text x="294" y="327" font-size="18" fill="#000" id="typography1">Технологический стиль</text>
            <rect x="530" y="342" width="200" height="200" fill="#cc33cc" rx="10" id="color6" />
            <text x="565" y="327" font-size="18" fill="#000" id="typography1">Модный стиль</text>
        </svg>
    </div>

    <script src="4.js"></script>
</body>
</html>
