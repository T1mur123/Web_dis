<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная галерея</title>
    <link rel="stylesheet" href="gallery.css">
</head>

<body>
    <div class="animated-background"></div>
    <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="природа">Природа</button>
        <button class="filter-btn" data-filter="города">Города</button>
        <button class="filter-btn" data-filter="архитектура">Архитектура</button>
        <button class="filter-btn" data-filter="пляжи">Пляжи</button>
        <button class="filter-btn" data-filter="горы">Горы</button>
    </div>

    <div class="gallery">
        <div class="card" data-tags="природа горы">
            <img src="луга.webp" alt="Пейзаж">
            <div class="card-content">
                <h3>Горный пейзаж</h3>
                <p>Альпийские луга в Швейцарии</p>
                <div class="tags">
                    <span class="tag">природа</span>
                    <span class="tag">горы</span>
                </div>
            </div>
        </div>

        <div class="card" data-tags="города архитектура">
            <img src="панорама.webp" alt="Город">
            <div class="card-content">
                <h3>Ночной город</h3>
                <p>Панорама современного мегаполиса</p>
                <div class="tags">
                    <span class="tag">города</span>
                    <span class="tag">архитектура</span>
                </div>
            </div>
        </div>
    </div>

    <form class="add-form" id="addForm">
        <div class="form-group">
            <input type="text" placeholder="Название изображения" id="title" required>
        </div>
        <div class="form-group">
            <textarea placeholder="Описание" id="description" required></textarea>
        </div>
        <div class="form-group">
            <input type="text" placeholder="Теги (через запятую)" id="tags" required>
        </div>
        <div class="form-group">
            <label for="imageUpload" class="upload-button">
                Загрузить изображение
            </label>
            <input type="file" accept="image/*" id="imageUpload" style="display: none;" required>
            <span id="file-name"></span>
        </div>
        <button type="submit" class="filter-btn">Добавить</button>
    </form>

    <script src="gallery.js"></script>
</body>

</html>
