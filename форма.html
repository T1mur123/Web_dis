<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <link rel="stylesheet" href="форма.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="container">
            <h2 style="margin-top: 0;">Регистрация</h2>
            <form id="myForm">
                <div class="row">
                    <div class="col-left">
                        <div class="form-group">
                            <label for="fio">ФИО:</label>
                            <input type="text" id="fio" name="fio" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Пол:</label>
                            <div class="radio-group">
                                <div class="radio-item">
                                    <span>Мужской</span>
                                    <input type="radio" id="male" name="gender" value="male">
                                </div>
                                <div class="radio-item">
                                    <span>Женский</span>
                                    <input type="radio" id="female" name="gender" value="female">
                                </div>
                                <div class="radio-item">
                                    <span>Другой</span>
                                    <input type="radio" id="other" name="gender" value="other">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль:</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="country">Страна:</label>
                            <select id="country" name="country">
                                <option value="ru">Россия</option>
                                <option value="uk">UK</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-right">
                        <div class="form-group">
                            <label for="dishes">Любимые блюда:</label>
                            <div class="checkbox-group">
                                <div class="checkbox-item">
                                    <span>Пицца</span>
                                    <input type="checkbox" id="pizza" name="dishes" value="pizza">
                                </div>
                                <div class="checkbox-item">
                                    <span>Суши</span>
                                    <input type="checkbox" id="sushi" name="dishes" value="sushi">
                                </div>
                                <div class="checkbox-item">
                                    <span>Бургер</span>
                                    <input type="checkbox" id="burger" name="dishes" value="burger">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="about">О себе:</label>
                            <textarea id="about" name="about"></textarea>
                        </div>
                    </div>
                </div>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <script src="форма.js"></script>
</body>
</html>
